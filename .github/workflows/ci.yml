name: Pudding Plan CI/CD Quality Gate

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  frontend-validation:
    name: Frontend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Prettier Format Check
        run: npm run format:check

      - name: ESLint Code Quality Check
        run: npm run lint

      - name: Run Jest Unit Tests
        run: npm run test -- __tests__/planUtils.test.ts

  backend-validation:
    name: Backend Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd server
          npm ci

      - name: Verify Backend Builds / Syntax
        run: |
          cd server
          node --check src/index.js
