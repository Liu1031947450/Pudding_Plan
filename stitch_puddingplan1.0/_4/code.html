<!DOCTYPE html>

<html lang="zh-Hans"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PuddingPlan 系统设置</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta_Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed": "#354e30",
                    "outline": "#797b7a",
                    "on-error": "#fff7f6",
                    "error-container": "#fa7150",
                    "secondary": "#4b6646",
                    "tertiary-fixed-dim": "#93c3ef",
                    "secondary-fixed-dim": "#ccebc2",
                    "error": "#aa371c",
                    "primary-dim": "#665100",
                    "tertiary-dim": "#22577e",
                    "primary-fixed-dim": "#eac655",
                    "surface-tint": "#745c00",
                    "on-background": "#303333",
                    "primary-container": "#f9d461",
                    "surface-variant": "#e1e3e2",
                    "tertiary-fixed": "#a1d1fe",
                    "on-tertiary-fixed-variant": "#1a5177",
                    "secondary-dim": "#3f5a3a",
                    "on-secondary-container": "#466141",
                    "on-primary": "#fff8ee",
                    "surface-container-high": "#e7e8e7",
                    "inverse-on-surface": "#9d9d9c",
                    "on-secondary-fixed-variant": "#506b4a",
                    "inverse-surface": "#0d0e0e",
                    "inverse-primary": "#f9d461",
                    "surface-container-low": "#f4f3f2",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed": "#003351",
                    "on-error-container": "#671200",
                    "outline-variant": "#b0b2b1",
                    "on-primary-fixed-variant": "#675200",
                    "surface-bright": "#faf9f8",
                    "surface-container": "#eeeeed",
                    "on-primary-fixed": "#463600",
                    "on-tertiary-container": "#0a476d",
                    "on-surface": "#303333",
                    "surface-dim": "#d8dad9",
                    "primary-fixed": "#f9d461",
                    "on-tertiary": "#f6f9ff",
                    "on-surface-variant": "#5d605f",
                    "secondary-fixed": "#dafad0",
                    "on-primary-container": "#5c4900",
                    "surface-container-highest": "#e1e3e2",
                    "tertiary": "#31638a",
                    "primary": "#745c00",
                    "tertiary-container": "#a1d1fe",
                    "secondary-container": "#dafad0",
                    "on-secondary": "#eaffe1",
                    "error-dim": "#821a01",
                    "background": "#faf9f8",
                    "surface": "#faf9f8"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Plus Jakarta Sans"],
                    "body": ["Plus Jakarta Sans"],
                    "label": ["Plus Jakarta Sans"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#faf9f8]/80 dark:bg-stone-900/80 backdrop-blur-xl">
<div class="flex items-center h-16 px-6 w-full max-w-screen-xl mx-auto">
<button class="mr-4 hover:bg-[#f4f3f2] dark:hover:bg-stone-800 transition-colors rounded-full p-2 active:scale-95 duration-200 ease-out">
<span class="material-symbols-outlined text-[#745c00] dark:text-[#f9d461]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] text-[1.375rem] font-semibold leading-tight text-[#745c00] dark:text-[#f9d461]">系统设置</h1>
</div>
</header>
<main class="pt-24 px-6 max-w-md mx-auto space-y-8 pb-12">
<!-- Account & Security Section -->
<section class="space-y-3">
<h3 class="px-2 text-on-surface-variant text-xs font-bold uppercase tracking-widest">账号与安全</h3>
<div class="bg-surface-container-low rounded-lg overflow-hidden">
<div class="flex items-center justify-between p-4 hover:bg-[#f4f3f2] dark:hover:bg-stone-800 transition-colors group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="person">person</span>
<span class="text-on-surface font-medium">个人资料修改</span>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</div>
<div class="flex items-center justify-between p-4 hover:bg-[#f4f3f2] dark:hover:bg-stone-800 transition-colors group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="smartphone">smartphone</span>
<span class="text-on-surface font-medium">手机号绑定</span>
</div>
<div class="flex items-center gap-2">
<span class="text-on-surface-variant text-sm">138****8888</span>
<span class="material-symbols-outlined text-outline-variant group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</div>
</div>
</div>
</section>
<!-- Notifications Section -->
<section class="space-y-3">
<h3 class="px-2 text-on-surface-variant text-xs font-bold uppercase tracking-widest">通知管理</h3>
<div class="bg-surface-container-low rounded-lg overflow-hidden">
<div class="flex items-center justify-between p-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary" data-icon="notifications">notifications</span>
<span class="text-on-surface font-medium">每日提醒</span>
</div>
<div class="w-12 h-6 bg-primary-container rounded-full relative cursor-pointer">
<div class="absolute right-1 top-1 w-4 h-4 bg-on-primary-container rounded-full"></div>
</div>
</div>
<div class="flex items-center justify-between p-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary" data-icon="bedtime">bedtime</span>
<span class="text-on-surface font-medium">勿扰模式 (静谧时间)</span>
</div>
<span class="text-on-surface-variant text-sm">22:00 - 07:00</span>
</div>
</div>
</section>
<!-- Display Section -->
<section class="space-y-3">
<h3 class="px-2 text-on-surface-variant text-xs font-bold uppercase tracking-widest">显示设置</h3>
<div class="bg-surface-container-low rounded-lg overflow-hidden">
<div class="flex items-center justify-between p-4">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-tertiary" data-icon="dark_mode">dark_mode</span>
<span class="text-on-surface font-medium">深色模式</span>
</div>
<div class="w-12 h-6 bg-surface-container-high rounded-full relative cursor-pointer">
<div class="absolute left-1 top-1 w-4 h-4 bg-outline rounded-full"></div>
</div>
</div>
<div class="flex items-center justify-between p-4 hover:bg-[#f4f3f2] dark:hover:bg-stone-800 transition-colors">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-tertiary" data-icon="text_fields">text_fields</span>
<span class="text-on-surface font-medium">字体大小</span>
</div>
<span class="text-on-surface-variant text-sm">标准</span>
</div>
</div>
</section>
<!-- Privacy & Terms -->
<section class="space-y-3">
<h3 class="px-2 text-on-surface-variant text-xs font-bold uppercase tracking-widest">隐私与条款</h3>
<div class="bg-surface-container-low rounded-lg overflow-hidden">
<div class="p-4 hover:bg-[#f4f3f2] dark:hover:bg-stone-800 transition-colors flex justify-between items-center group">
<span class="text-on-surface font-medium">隐私政策</span>
<span class="material-symbols-outlined text-outline-variant group-hover:translate-x-1 transition-transform" data-icon="policy">policy</span>
</div>
<div class="p-4 hover:bg-[#f4f3f2] dark:hover:bg-stone-800 transition-colors flex justify-between items-center group">
<span class="text-on-surface font-medium">用户协议</span>
<span class="material-symbols-outlined text-outline-variant group-hover:translate-x-1 transition-transform" data-icon="description">description</span>
</div>
<div class="p-4 hover:bg-[#f4f3f2] dark:hover:bg-stone-800 transition-colors flex justify-between items-center text-error group">
<span class="font-medium">清除所有数据</span>
<span class="material-symbols-outlined group-hover:scale-110 transition-transform" data-icon="delete_forever">delete_forever</span>
</div>
</div>
</section>
<!-- About -->
<section class="space-y-3">
<h3 class="px-2 text-on-surface-variant text-xs font-bold uppercase tracking-widest">关于</h3>
<div class="bg-surface-container-low rounded-lg overflow-hidden">
<div class="flex items-center justify-between p-4">
<span class="text-on-surface font-medium">当前版本</span>
<span class="text-on-surface-variant text-sm">v2.4.0 (Stable)</span>
</div>
<div class="p-4 hover:bg-[#f4f3f2] dark:hover:bg-stone-800 transition-colors flex justify-between items-center group">
<span class="text-on-surface font-medium">意见反馈</span>
<span class="material-symbols-outlined text-outline-variant group-hover:translate-x-1 transition-transform" data-icon="chat_bubble">chat_bubble</span>
</div>
</div>
</section>
<!-- Log Out Button (Pudding Stamp style) -->
<div class="pt-4">
<button class="w-full py-4 bg-surface-container-high text-on-surface-variant rounded-xl font-semibold tracking-wide hover:bg-error-container hover:text-on-error transition-all active:scale-95 duration-200">
                退出登录
            </button>
</div>
</main>
</body></html>
