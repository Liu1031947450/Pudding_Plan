<body class="bg-background text-on-surface min-h-screen pb-32">

<header class="fixed top-0 w-full z-50 flex items-center justify-between px-6 py-4 bg-[#faf9f8]/80 dark:bg-stone-900/80 backdrop-blur-xl">

</div>
<h1 class="text-[2.5rem] font-extrabold text-on-surface tracking-tight leading-tight mb-4">还没有计划？</h1>
<p class="text-on-surface-variant text-lg max-w-xs leading-relaxed mb-10">
                开启你的第一个治愈计划，让成长自然发生。
            </p>
<!-- Primary Action -->
<button class="group relative px-10 py-5 bg-primary-container rounded-xl text-on-primary-container font-bold text-lg flex items-center gap-3 transition-transform active:scale-95 shadow-[0_12px_32px_rgba(116,92,0,0.08)]">
<span class="material-symbols-outlined text-2xl" data-icon="add_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">add_circle</span>
                创建治愈计划
            </button>
</section>
<!-- Template Selection (Bento Style) -->
<section class="grid grid-cols-2 gap-4 mb-12">
<div class="col-span-2 text-left mb-2">
<h2 class="text-xl font-bold px-2">从模板开始</h2>
</div>
<!-- Template Card 1 -->
<div class="bg-surface-container-lowest p-6 rounded-lg flex flex-col gap-4 group cursor-pointer transition-colors hover:bg-surface-container-low">
<div class="w-12 h-12 bg-secondary-container rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-secondary" data-icon="spa" data-weight="fill" style="font-variation-settings: 'FILL' 1;">spa</span>
</div>
<div>
<h3 class="font-bold text-on-surface">晨间唤醒</h3>
<p class="text-sm text-on-surface-variant">21天习惯养成</p>
</div>
</div>
<!-- Template Card 2 -->
<div class="bg-surface-container-lowest p-6 rounded-lg flex flex-col gap-4 group cursor-pointer transition-colors hover:bg-surface-container-low">

<span class="material-symbols-outlined text-tertiary" data-icon="menu_book" data-weight="fill" style="font-variation-settings: 'FILL' 1;">menu_book</span>

<span class="material-symbols-outlined mb-1" data-icon="edit_note" data-weight="fill" style="font-variation-settings: 'FILL' 1;">edit_note</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Plan</span>
</a>

<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Calendar</span>
</a>

<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Profile</span>
</a>
