<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
                  "tertiary-fixed": "#a1d1fe",
                  "outline-variant": "#b0b2b1",
                  "surface-tint": "#745c00",
                  "on-tertiary-fixed-variant": "#1a5177",
                  "surface-container-lowest": "#ffffff",
                  "primary-fixed": "#f9d461",
                  "on-secondary-fixed-variant": "#506b4a",
                  "secondary-fixed": "#dafad0",
                  "tertiary-fixed-dim": "#93c3ef",
                  "tertiary-container": "#a1d1fe",
                  "on-error-container": "#671200",
                  "surface-container": "#eeeeed",
                  "primary-container": "#f9d461",
                  "on-secondary-container": "#466141",
                  "on-primary-fixed-variant": "#675200",
                  "surface-container-high": "#e7e8e7",
                  "secondary-fixed-dim": "#ccebc2",
                  "surface-container-low": "#f4f3f2",
                  "inverse-primary": "#f9d461",
                  "error-container": "#fa7150",
                  "surface-dim": "#d8dad9",
                  "tertiary-dim": "#22577e",
                  "inverse-surface": "#0d0e0e",
                  "on-tertiary-container": "#0a476d",
                  "secondary": "#4b6646",
                  "outline": "#797b7a",
                  "on-tertiary-fixed": "#003351",
                  "on-error": "#fff7f6",
                  "primary": "#745c00",
                  "on-primary": "#fff8ee",
                  "background": "#faf9f8",
                  "surface-container-highest": "#e1e3e2",
                  "on-surface-variant": "#5d605f",
                  "on-surface": "#303333",
                  "on-secondary": "#eaffe1",
                  "on-primary-container": "#5c4900",
                  "error": "#aa371c",
                  "on-primary-fixed": "#463600",
                  "error-dim": "#821a01",
                  "on-tertiary": "#f6f9ff",
                  "inverse-on-surface": "#9d9d9c",
                  "secondary-dim": "#3f5a3a",
                  "tertiary": "#31638a",
                  "on-background": "#303333",
                  "primary-fixed-dim": "#eac655",
                  "surface-variant": "#e1e3e2",
                  "surface": "#faf9f8",
                  "primary-dim": "#665100",
                  "on-secondary-fixed": "#354e30",
                  "surface-bright": "#faf9f8",
                  "secondary-container": "#dafad0"
          },
          "borderRadius": {
                  "DEFAULT": "1rem",
                  "lg": "2rem",
                  "xl": "3rem",
                  "full": "9999px"
          },
          "fontFamily": {
                  "headline": ["Plus Jakarta Sans"],
                  "body": ["Plus Jakarta Sans"],
                  "label": ["Plus Jakarta Sans"]
          }
        },
      },
    }
  </script>
<style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen pb-32">
<!-- Simplified Header -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-6 py-4 bg-[#faf9f8]/90 backdrop-blur-xl">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-2xl text-primary" data-icon="bubble_chart">bubble_chart</span>
<h1 class="text-xl font-bold text-on-surface tracking-tight">我的计划</h1>
</div>
<div class="flex items-center gap-3">
<button class="w-10 h-10 flex items-center justify-center rounded-full bg-primary-container/30 text-primary active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="notifications">notifications</span>
</button>
</div>
</header>
<main class="pt-24 px-6 max-w-5xl mx-auto space-y-10">
<!-- Active Plans Section -->
<section class="space-y-6">
<div class="flex items-center justify-between">
<h2 class="text-2xl font-extrabold tracking-tight text-on-surface">正在进行</h2>
<button class="text-primary font-bold text-sm">管理计划</button>
</div>
<div class="grid grid-cols-1 gap-4">
<!-- Plan Card 1 -->
<div class="bg-surface-container-low p-5 rounded-lg border border-primary-fixed/30 shadow-sm relative overflow-hidden group">
<div class="flex justify-between items-start mb-4">
<div class="flex gap-4 items-center">
<div class="w-12 h-12 rounded-full bg-primary-container flex items-center justify-center text-primary">
<span class="material-symbols-outlined" data-icon="self_improvement">self_improvement</span>
</div>
<div>
<h3 class="font-bold text-lg text-on-surface">21天正念冥想</h3>
<p class="text-xs text-on-surface-variant">已坚持 14 天</p>
</div>
</div>
<div class="text-right">
<span class="text-2xl font-extrabold text-primary">66%</span>
</div>
</div>
<div class="w-full bg-surface-container-high rounded-full h-2">
<div class="bg-primary h-2 rounded-full w-[66%]"></div>
</div>
</div>
<!-- Plan Card 2 -->
<div class="bg-surface-container-low p-5 rounded-lg border border-transparent shadow-sm">
<div class="flex justify-between items-start mb-4">
<div class="flex gap-4 items-center">
<div class="w-12 h-12 rounded-full bg-tertiary-container flex items-center justify-center text-on-tertiary-container">
<span class="material-symbols-outlined" data-icon="fitness_center">fitness_center</span>
</div>
<div>
<h3 class="font-bold text-lg text-on-surface">60天减脂挑战</h3>
<p class="text-xs text-on-surface-variant">已坚持 12 天</p>
</div>
</div>
<div class="text-right">
<span class="text-2xl font-extrabold text-on-tertiary-container">20%</span>
</div>
</div>
<div class="w-full bg-surface-container-high rounded-full h-2">
<div class="bg-tertiary h-2 rounded-full w-[20%]"></div>
</div>
</div>
<!-- Add New Plan Prominent Card -->
<button class="bg-white border-2 border-dashed border-outline-variant/30 p-6 rounded-lg flex flex-col items-center justify-center gap-2 group hover:bg-primary-container/10 transition-colors">
<div class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-outline group-hover:bg-primary group-hover:text-white transition-colors">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
</div>
<span class="font-bold text-on-surface-variant group-hover:text-primary transition-colors">开启新计划</span>
</button>
</div>
</section>
<!-- Consistency Rhythm Section (Retained) -->
<section class="space-y-6">
<div class="flex items-center justify-between">
<h3 class="text-xl font-bold tracking-tight text-on-surface">坚持节奏</h3>
<div class="flex gap-2">
<span class="px-4 py-1 rounded-full bg-surface-container-high text-sm font-semibold">周</span>
<span class="px-4 py-1 rounded-full text-on-surface-variant text-sm font-semibold">月</span>
</div>
</div>
<div class="bg-surface-container-lowest rounded-lg p-8 shadow-sm h-64 flex items-end justify-between gap-2">
<div class="flex-1 bg-secondary-fixed-dim rounded-t-full h-[40%]" title="周一"></div>
<div class="flex-1 bg-secondary-fixed-dim rounded-t-full h-[65%]" title="周二"></div>
<div class="flex-1 bg-secondary-fixed-dim rounded-t-full h-[55%]" title="周三"></div>
<div class="flex-1 bg-primary-fixed rounded-t-full h-[95%]" title="周四"></div>
<div class="flex-1 bg-secondary-fixed-dim rounded-t-full h-[70%]" title="周五"></div>
<div class="flex-1 bg-secondary-fixed-dim rounded-t-full h-[45%]" title="周六"></div>
<div class="flex-1 bg-secondary-fixed-dim rounded-t-full h-[80%]" title="周日"></div>
</div>
<div class="flex justify-between px-2 text-on-surface-variant text-xs font-bold uppercase tracking-tighter">
<span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
</div>
</section>
<!-- Milestones Section (Retained & Integrated) -->
<section class="space-y-6">
<h3 class="text-xl font-bold tracking-tight text-on-surface">已获成就</h3>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4">
<!-- Badge 1 -->
<div class="bg-surface-container-low p-6 rounded-lg flex flex-col items-center text-center gap-4 group">
<div class="w-20 h-20 rounded-full bg-white shadow-sm flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-4xl" data-icon="temp_preferences_eco" style="font-variation-settings: 'FILL' 1;">temp_preferences_eco</span>
</div>
<div>
<h4 class="font-bold text-on-surface">7天星火</h4>
<p class="text-sm text-on-surface-variant">完成第一周</p>
</div>
</div>
<!-- Badge 2 -->
<div class="bg-surface-container-low p-6 rounded-lg flex flex-col items-center text-center gap-4 group">
<div class="w-20 h-20 rounded-full bg-white shadow-sm flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-4xl" data-icon="workspace_premium" style="font-variation-settings: 'FILL' 1;">workspace_premium</span>
</div>
<div>
<h4 class="font-bold text-on-surface">自律达人</h4>
<p class="text-sm text-on-surface-variant">维持 14 天连续纪录</p>
</div>
</div>
<!-- Badge 3 -->
<div class="bg-surface-container-low p-6 rounded-lg flex flex-col items-center text-center gap-4 group">
<div class="w-20 h-20 rounded-full bg-white shadow-sm flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-4xl" data-icon="groups" style="font-variation-settings: 'FILL' 1;">groups</span>
</div>
<div>
<h4 class="font-bold text-on-surface">初入圈子</h4>
<p class="text-sm text-on-surface-variant">同行共进，更好生活</p>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pb-8 pt-4 bg-[#faf9f8]/80 dark:bg-stone-900/80 backdrop-blur-xl z-50 rounded-t-[3rem] shadow-[0_-12px_32px_rgba(116,92,0,0.08)]">
<!-- Plan (ACTIVE) -->
<a class="flex flex-col items-center justify-center bg-[#f9d461] dark:bg-[#745c00] text-[#745c00] dark:text-[#f9d461] rounded-[2rem] px-5 py-2 scale-105 active:scale-90 duration-150 ease-out" href="#">
<span class="material-symbols-outlined mb-1" data-icon="edit_note" data-weight="fill" style="font-variation-settings: 'FILL' 1;">edit_note</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Plan</span>
</a>
<!-- Calendar -->
<a class="flex flex-col items-center justify-center text-[#5d605f] dark:text-stone-400 px-4 py-2 hover:bg-[#f4f3f2] dark:hover:bg-stone-800 rounded-full transition-colors active:scale-90 duration-150 ease-out" href="#">
<span class="material-symbols-outlined mb-1" data-icon="calendar_today">calendar_today</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Calendar</span>
</a>
<!-- Circles -->
<a class="flex flex-col items-center justify-center text-[#5d605f] dark:text-stone-400 px-4 py-2 hover:bg-[#f4f3f2] dark:hover:bg-stone-800 rounded-full transition-colors active:scale-90 duration-150 ease-out" href="#">
<span class="material-symbols-outlined mb-1" data-icon="group">group</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Circles</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-[#5d605f] dark:text-stone-400 px-4 py-2 hover:bg-[#f4f3f2] dark:hover:bg-stone-800 rounded-full transition-colors active:scale-90 duration-150 ease-out" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-['Plus_Jakarta_Sans'] text-[11px] font-semibold tracking-wide">Profile</span>
</a>
</nav>
</body></html>
